[package]
name = "mpro"
version = "2.5.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"
once_cell = "1.19"
h2 = "0.4"
http = "1"
bytes = "1"
quinn = "0.10"
rustls-native-certs = "0.6"
futures-util = "0.3"
tun = "0.6"
etherparse = "0.13"
net2 = "0.2"
libc = "0.2"

[[bin]]
name = "mpro"
path = "src/main.rs"

[[bin]]
name = "mpro-xhttp"
path = "src/bin/xhttp.rs"

[[bin]]
name = "mpro-integrated"
path = "src/bin/xhttp_integrated.rs"
